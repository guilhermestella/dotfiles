[tools]
java = "25"
node = "26"
python = "3"
rust = "1"
usage = "latest"

[tasks.setup]
run = """
mise run java
mise run node
mise run python
mise run rust
mise run usage
"""

[tasks.java]
run = """
for v in 11 17 21 25; do
  mise install java@$v
done
"""

[tasks.node]
run = """
mise install node@26
"""

[tasks.python]
run = "mise install python@3"

[tasks.rust]
run = """
mise install rust@1
"""

[tasks.usage]
run = """
mise install usage@latest
"""
