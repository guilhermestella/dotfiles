[tools]
java = "27"
node = "26.13.1"
python = "3.15.2"
rust = "1.100.0"
cargo = "latest"
usage = "latest"

[tasks.setup]
run = """
mise run java
mise run node
mise run python
mise run rust
mise run usage
"""

[tasks.java]
run = """
for v in 11 17 21 25; do
  mise install java@$v
done
"""

[tasks.node]
run = """
mise install node@26.13.0
"""

[tasks.python]
run = "mise install python@3.14.0"

[tasks.rust]
run = """
mise install rust@1.94
mise install cargo@0.95.0
"""

[tasks.usage]
run = """
mise install usage@latest
"""
