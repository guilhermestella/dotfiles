set -g status "2"
set -g status-bg "$bg_main"
set -g status-position top
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-style "bold"
set -g status-format[1] "#[fg=$bg_separator,bg=$bg_main]#{R:─,#{client_width}}"

set -g pane-border-style "fg=$bg_separator"
set -g pane-active-border-style "fg=$color_focus"

set -g message-style "fg=$bg_main,bg=$bg_main"
set -g message-command-style "fg=$bg_main,bg=$bg_main"

setw -g window-status-style "bg=default,fg=default"
setw -g window-status-activity-style "bg=$bg_main,fg=$color_activity"
setw -g window-status-separator "#[fg=$bg_separator] "

set -g status-right "#{?client_prefix,#[fg=$color_alert],#[fg=$color_success]} #S #[nobold,nounderscore,noitalics]"
set -g status-left " "

setw -g window-status-format " #W "
setw -g window-status-current-format "#[fg=$color_success,bg=default,nobold,nounderscore,noitalics]#[fg=$color_success,bg=default,bold] #W #[fg=$color_success,bg=default,nobold,nounderscore,noitalics]"
